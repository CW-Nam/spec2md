[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spec2md"
version = "0.1.0"
description = "3GPP specification .docx -> clause-level Markdown raw files"
requires-python = ">=3.11"
dependencies = ["lxml==6.1.3", "olefile==0.47"]

# 개발·테스트 전용. uv sync/uv run이 기본으로 함께 설치한다.
[dependency-groups]
dev = ["python-docx==1.2.0", "pytest==9.2.0"]

[project.scripts]
spec2md = "spec2md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
