[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spec2md"
version = "0.1.0"
description = "3GPP specification .docx -> clause-level Markdown raw files"
requires-python = ">=3.11"
dependencies = ["lxml==6.1.3"]

[project.scripts]
spec2md = "spec2md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
